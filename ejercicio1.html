<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Texto</title>
</head>
<body>

    <h2>Ejemplo de JavaScript</h2>

    <p id="miParrafo"></p>

    <button onclick="actualizarTexto()">Actualizar texto</button>

    <script>
        function actualizarTexto() {
            document.getElementById("miParrafo").innerText = "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
